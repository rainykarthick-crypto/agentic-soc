# =============================================================================
# SOC dashboard - static UI + same-origin API proxy
# =============================================================================
# Two jobs:
#   1. serve index.html
#   2. proxy /api/* to the agent on the backend network
#
# The proxy is what makes the browser work at all. The original upstream page
# called http://<window.location.hostname>:8000 directly, which on this host is
# Nautobot, not the SOC agent (the agent publishes 8010 because 8000 was taken).
# Same-origin /api/ removes both the wrong-port bug and any CORS requirement.
#
# resolver + variable proxy_pass: soc-agent is resolved per-request, so nginx
# still starts when the agent has not come up yet.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $soc_api http://soc-agent:8000;

    location /api/ {
        # strip the /api prefix: /api/status -> /status
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $soc_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        # An unreachable agent should surface as a clean 502 the UI can report,
        # not a hanging request.
        proxy_intercept_errors off;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
